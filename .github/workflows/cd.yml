name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read
  id-token: write

jobs:
  push-image:
    name: Build and push ECR image
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image name
        id: image
        run: |
          echo "uri=${{ steps.ecr-login.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.uri }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start EC2 deployment
        id: deployment
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          PUBLIC_DOMAIN: ${{ vars.PUBLIC_DOMAIN || '52-209-95-128.sslip.io' }}
        run: |
          COMPOSE_B64=$(base64 --wrap=0 docker-compose.prod.yaml)
          CADDY_B64=$(base64 --wrap=0 Caddyfile)
          DEPLOY_B64=$(base64 --wrap=0 scripts/deploy.sh)

          DEPLOY_COMMAND="set -eu
          install -d -m 755 /opt/online-cinema
          printf '%s' '${COMPOSE_B64}' | base64 --decode > /opt/online-cinema/docker-compose.prod.yaml
          printf '%s' '${CADDY_B64}' | base64 --decode > /opt/online-cinema/Caddyfile
          printf '%s' '${DEPLOY_B64}' | base64 --decode > /opt/online-cinema/deploy.sh
          chmod 700 /opt/online-cinema/deploy.sh
          /opt/online-cinema/deploy.sh '${IMAGE_URI}' '${AWS_REGION}' '${PUBLIC_DOMAIN}'"

          PARAMETERS=$(jq -cn \
            --arg command "${DEPLOY_COMMAND}" \
            '{commands: [$command]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Online Cinema" \
            --parameters "${PARAMETERS}" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Wait for EC2 deployment
        env:
          COMMAND_ID: ${{ steps.deployment.outputs.command_id }}
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set +e

          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}"
          DEPLOYMENT_STATUS=$?

          set -e

          echo "Deployment output:"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardOutputContent" \
            --output text

          echo "Deployment errors:"
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --query "StandardErrorContent" \
            --output text

          exit "${DEPLOYMENT_STATUS}"
